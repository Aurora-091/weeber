# Supabase project config for Weeber. Used ONLY for Storage (KB PDF
# uploads), Auth (real merchant accounts — replacing labeled admin keys for
# the merchant-facing dashboard, NOT for Weeber's own internal ops access,
# which keeps using ADMIN_API_KEY/admin_keys), and Edge Functions
# (low-frequency async jobs). The core relational DB stays on Turso/libSQL
# — see WEEBER-PLAN.md for why this isn't a full Postgres migration.
#
# Run `supabase link --project-ref <ref>` after creating the project, then
# `supabase db push` / `supabase functions deploy` as usual.

project_id = "weeber"

[api]
enabled = true

[db]
# Not used for application data — Supabase's own Postgres here only backs
# Auth and Storage's internal metadata tables, not Weeber's business data.
port = 54322

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "https://app.weeber.ai"
# All auth emails are OTP-code-only (ADR-043; templates/recovery.html made
# password reset code-only too), so no live flow depends on this allowlist —
# it covers the /auth/callback and /auth/reset-password fallback routes and
# any future OAuth flow. Bare origins exact-match the root; `/**` globs cover
# every subpath on the three legitimate surfaces. No other domains belong
# here (stale *.vercel.app entries are removed by `supabase config push`).
#
# 2026-08-18 Supabase account migration: this file is per-project config, so
# it has to be pushed separately against BOTH new projects (production
# qghtkadxbtptvbfbmsdz and staging zbcrwexrqfmjxhewirgp) — `supabase link`
# only targets one project ref at a time. Neither has run `supabase config
# push` yet (no CLI/access token available in the session that created
# them), so both are still on Supabase's own defaults. Not a hard blocker —
# the comment above already establishes no live flow needs this allowlist —
# but do this before relying on the magic-link/reset-link fallback routes or
# any future OAuth flow on either project.
additional_redirect_urls = [
  "https://app.weeber.ai",
  "https://app.weeber.ai/**",
  "https://admin.weeber.ai",
  "https://admin.weeber.ai/**",
  "https://staging-app.weeber.ai",
  "https://staging-app.weeber.ai/**",
  "https://staging-admin.weeber.ai",
  "https://staging-admin.weeber.ai/**",
  "http://localhost:5173",
  "http://localhost:5173/**",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

# Weeber-branded email templates (ADR-043). All three render {{ .Token }}
# only — a 6-digit code, no URL — so no email flow depends on the redirect
# allowlist (recovery went code-only too; see templates/recovery.html).
# NOTE for the hosted project: these apply locally / via `supabase config push`.
# If pushing isn't set up, paste each file's HTML + subject into
# Dashboard -> Authentication -> Emails (templates) — keep both in sync.
[auth.email.template.magic_link]
subject = "Your Weeber sign-in code"
content_path = "./supabase/templates/magic-link.html"

[auth.email.template.confirmation]
subject = "Confirm your Weeber account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your Weeber password"
content_path = "./supabase/templates/recovery.html"

[functions.gdpr-redact-notify]
verify_jwt = true
