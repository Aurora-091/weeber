<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<!-- Favicon & App Icons -->
		<link rel="icon" type="image/png" href="/favicon.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/weeber_favicon_transparent.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<link rel="manifest" href="/manifest.json" />
		<meta name="theme-color" content="#1A1A1A" />
		<meta name="application-name" content="Weeber" />

		<!-- Primary Meta -->
		<title>Weeber — AI Voice Agents for Missed Calls | Join the Waitlist</title>
		<meta
			name="description"
			content="Weeber gives Shopify stores and clinics an AI voice agent on a real phone number — recovers abandoned carts, answers order questions, books appointments, 24/7. Compliant by default. Join the waitlist."
		/>
		<meta
			name="keywords"
			content="AI voice agent, voice AI for Shopify, abandoned cart recovery calls, AI receptionist, voice AI for clinics, appointment booking AI, alternative to Vapi, alternative to Retell, TCPA compliant voice AI"
		/>
		<meta name="author" content="Weeber" />
		<meta name="publisher" content="Weeber" />
		<!-- VITE_ROBOTS_META defaults to fully indexable (see .env.example). The admin
		     and merchant Vercel projects must override it to "noindex, nofollow" --
		     this is the one directly-crawlable signal (static in the served HTML,
		     unlike the client-rendered app) that actually protects those subdomains
		     once they serve bare paths that no longer live under /dashboard or /app. -->
		<meta name="robots" content="%VITE_ROBOTS_META%" />
		<link rel="canonical" href="https://www.weeber.ai/" />

		<!-- Open Graph -->
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Weeber" />
		<meta property="og:title" content="Weeber — AI Voice Agents for Missed Calls" />
		<meta
			property="og:description"
			content="AI voice agents that book, recover carts, and follow up — 24/7, no code. Join the waitlist."
		/>
		<meta property="og:image" content="https://www.weeber.ai/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Weeber AI Voice Agents Platform" />
		<meta property="og:url" content="https://www.weeber.ai/" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter Card -->
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Weeber — AI Voice Agents for Missed Calls" />
		<meta
			name="twitter:description"
			content="AI voice agents that book, recover carts, and follow up — 24/7, no code. Join the waitlist."
		/>
		<meta name="twitter:image" content="https://www.weeber.ai/og-image.png" />

		<!-- Google Search Console — replace PLACEHOLDER with your verification code -->
		<!-- <meta name="google-site-verification" content="PLACEHOLDER" /> -->

		<!-- Organization Schema -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "Organization",
				"name": "Weeber",
				"url": "https://www.weeber.ai/",
				"logo": "https://www.weeber.ai/weeber_logo_transparent.png",
				"description": "Weeber is a vertical voice AI platform for Shopify stores and clinics — AI phone agents that recover abandoned carts, answer order questions, and book appointments, compliant by default.",
				"foundingDate": "2026",
				"founders": [
					{ "@type": "Person", "name": "Ashutosh Tiwari" },
					{ "@type": "Person", "name": "Rushikesh Pawar" }
				],
				"contactPoint": {
					"@type": "ContactPoint",
					"email": "hello@weeber.ai",
					"contactType": "customer service"
				}
			}
		</script>

		<!-- WebSite Schema (enables sitelinks search box) -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebSite",
				"name": "Weeber",
				"url": "https://www.weeber.ai/",
				"potentialAction": {
					"@type": "SearchAction",
					"target": "https://www.weeber.ai/?q={search_term_string}",
					"query-input": "required name=search_term_string"
				}
			}
		</script>

		<!-- SoftwareApplication Schema -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "SoftwareApplication",
				"name": "Weeber",
				"applicationCategory": "BusinessApplication",
				"applicationSubCategory": "Voice AI Platform",
				"operatingSystem": "Web",
				"description": "AI voice agents that recover abandoned carts, confirm COD orders, book appointments, and collect feedback — 24/7, no code, compliant by default.",
				"url": "https://www.weeber.ai/",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD",
					"description": "Free to join the waitlist. Founder pricing locked for first 100 customers.",
					"availability": "https://schema.org/PreOrder"
				},
				"featureList": [
					"Abandoned cart recovery calls",
					"COD order confirmation",
					"Post-delivery feedback collection",
					"Appointment booking",
					"Bilingual English/Hindi support",
					"TCPA & DNC compliance enforcement",
					"Shopify integration",
					"No-code setup"
				]
			}
		</script>

		<!-- FAQPage schema lives on /faq itself now (injected dynamically, matches the full
		     question set actually rendered there via useJsonLd) — removed the static duplicate
		     that used to live here since the home page no longer renders an inline FAQ block,
		     and mismatched schema/content is exactly what structured-data guidelines warn against. -->

		<!-- GTM/GA4 scripts are injected dynamically via /dashboard/settings -->
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
