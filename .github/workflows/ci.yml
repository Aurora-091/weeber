name: CI

# Runs on every push and PR against main. Keeps typecheck, tests, build, and
# lint green before anything merges — see CONTRIBUTING.md for what's
# expected locally before you push.
#
# Split into parallel jobs (was one long sequential job) so a failure in one
# area (e.g. lint) doesn't have to wait behind the others to report, and so
# CI finishes faster overall. `ci-success` at the bottom is the one job that
# depends on all the real work — set THAT as the required status check in
# GitHub branch protection (Settings -> Branches -> Require status checks
# to pass before merging), not the individual jobs above it. That way
# adding/renaming/splitting jobs later never means re-configuring branch
# protection to match — there's always exactly one name to require.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck (api, web, openvent-compliance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (api)
        run: cd packages/api && bun run typecheck
      - name: Typecheck (web)
        run: cd packages/web && bun run typecheck
      - name: Typecheck (openvent-compliance)
        run: cd packages/openvent-compliance && bun run typecheck

  test:
    name: Test (api, web, openvent-compliance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Test (api) — voice pipeline, integrations, resilience layer
        run: cd packages/api && bun run test
      - name: Test (web) — theme, vertical config, and other pure-logic units
        run: cd packages/web && bun run test
      - name: Test (openvent-compliance) — DNC, calling-window, HIPAA, GDPR, national-DNC adapter
        run: cd packages/openvent-compliance && bun run test

  build:
    name: Build (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build (web)
        # No real DATABASE_URL/API keys needed — this is a static build
        # (tsc --noEmit && vite build), nothing here touches a live database
        # or external API at build time.
        run: cd packages/web && bun run build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint

  migration-drift:
    name: Drizzle migrations match schema.ts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check for un-generated schema changes
        # drizzle-kit generate is deterministic given the same schema.ts +
        # existing migrations — if it produces a NEW file here, someone
        # edited schema.ts without running `bun run db:generate` and
        # committing the result. Catches the "forgot to generate the
        # migration" class of bug before it reaches main, not after a
        # deploy tries to run against a DB that doesn't match schema.ts.
        run: |
          cd packages/api
          BEFORE=$(ls drizzle/*.sql 2>/dev/null | wc -l)
          DATABASE_URL="postgres://ci:ci@localhost:5432/ci" bunx drizzle-kit generate
          AFTER=$(ls drizzle/*.sql 2>/dev/null | wc -l)
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "::error::schema.ts has changes with no committed migration. Run 'bun run db:generate' in packages/api and commit the result."
            git diff --stat
            exit 1
          fi

  e2e:
    name: E2E (public landing, Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      # Deps FIRST — a missing/stale node_modules makes turbo/test report a
      # false green (see docs/reference/testing.md). --frozen-lockfile guarantees
      # the committed bun.lock is used verbatim.
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser (chromium)
        run: cd packages/web && bunx playwright install --with-deps chromium
      - name: E2E (web) — public landing renders + client-side waitlist validation
        # Deterministic by design: targets the secret-free static path only.
        # The Playwright webServer runs `bun run build && vite preview`, so this
        # exercises the real shipped bundle with NO live backend or secrets —
        # it can't go false-red on a missing key.
        run: cd packages/web && bun run test:e2e

  design-guard:
    name: Design drift ratchet + contrast gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Design drift ratchet
        # Counts the hand-rolled buttons, native <select>s, arbitrary px values,
        # raw hex and cloned card markup that the design system is supposed to
        # own, and fails if any count went UP. Not a lint rule: 365 arbitrary px
        # values cannot be fixed in one commit, so a binary rule would have to be
        # disabled on day one. A ratchet cannot be. Budgets in
        # tools/ui-guard/design-budget.json come down as each phase lands.
        run: bun run design:guard
      - name: Contrast gate
        # Measures every declared token pair against its WCAG floor via
        # tools/ui-guard/contrast.py. Ratchet mode: the 9 pairs the audit already
        # found are declared in tokens.json, so this fails on a NEW contrast
        # failure or a declared one that got worse. Nothing here needs a browser
        # or a secret — it reads styles.css and does maths.
        run: bun run contrast:gate
      - name: Real contrast state (informational)
        # Prints the un-excused number so the Phase B backlog stays visible in
        # every CI log instead of only in tokens.json. Cannot fail the job.
        if: always()
        continue-on-error: true
        run: bun run contrast:gate --strict

  visual:
    name: Visual regression (78 baselines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser (chromium)
        run: cd packages/web && bunx playwright install --with-deps chromium
      - name: Visual regression
        # Secret-free: the /__harness routes supply mock auth + query context, so
        # there is no SUPABASE_JWT_SECRET and no admin key here (see
        # src/web/pages/__harness/index.tsx). Baselines are Linux + headless
        # Chromium and are committed, so this job is the authority on them — a
        # macOS run will differ on font rasterisation and must not update them.
        run: cd packages/web && bun run test:visual
      - name: Upload diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            packages/web/test-results/
            packages/web/playwright-report/
          retention-days: 14

  a11y:
    name: Accessibility baseline (axe, report-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser (chromium)
        run: cd packages/web && bunx playwright install --with-deps chromium
      - name: axe over every route
        # REPORT-ONLY until Phase G converts it to a ratchet. It does still fail
        # on two things: a route that did not mount, and a route where axe could
        # apply fewer than 12 rules — because "0 violations" on a blank page is
        # the most dangerous possible green.
        run: cd packages/web && bun run test:a11y
      - name: Upload a11y baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-baseline
          path: packages/web/a11y-out/a11y-baseline.json
          retention-days: 30

  fonts:
    name: Font provenance (webfont-only rasterisation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser (chromium)
        run: cd packages/web && bunx playwright install --with-deps chromium
      - name: Font provenance
        # Asserts via CDP CSS.getPlatformFontsForNode that every glyph on all 26
        # routes came from a webfont this repo controls — not from a family
        # fontconfig picked off the runner image.
        #
        # This job exists because the `visual` job cannot tell you WHY. The first
        # CI run failed 51 of 78 baselines; 36 of them traced to one className
        # (dashboard-shell.tsx used Tailwind's stock `font-serif`, which contains
        # no webfont, so the admin wordmark rasterised from Caladea on Debian).
        # A pixel diff only ever said "290 pixels changed" — it could not say that
        # the baselines had quietly become a function of the build machine, nor
        # that the admin panel was not using the brand typeface at all. This gate
        # names both, and fails BEFORE 78 images move.
        run: cd packages/web && bun run test:fonts

  ci-success:
    name: CI success
    if: always()
    needs: [typecheck, test, build, lint, migration-drift, e2e, design-guard, visual, a11y, fonts]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependent job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "One or more required jobs failed:"
            echo "${{ toJSON(needs) }}"
            exit 1
          fi
