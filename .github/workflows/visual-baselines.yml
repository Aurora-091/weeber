name: Visual baselines (manual regenerate)

# WHY THIS EXISTS
# The 78 PNGs in packages/web/e2e-visual/visual.spec.ts-snapshots/ are an
# artifact of a specific browser build AND a specific OS font stack. Measured:
# the same pages rendered by a system Chrome instead of Playwright's bundled
# chromium-headless-shell differ by ~839 px at the median. The browser side is
# pinned (--frozen-lockfile + `playwright install`), the OS side is not — a
# baseline generated on a developer's Debian/macOS box can disagree with
# ubuntu-latest over glyph antialiasing.
#
# So: when the `visual` job in ci.yml reports diffs that are real but purely
# environmental, regenerate here — on the same runner image that verifies them —
# rather than locally.
#
# STATUS UPDATE (PR #2, run 3): that is no longer the only safe option. Since
# --disable-lcd-text pinned the last unpinned OS rasteriser knob, 36 baselines
# regenerated on Debian trixie passed unmodified on ubuntu-24.04. Any Linux
# machine may now regenerate; see the header of playwright.visual.config.ts for
# the four pins that make that true and for what to check when it stops being.
# This workflow stays as the tie-breaker for when CI and a local run disagree.
#
# TWO THINGS TO KNOW BEFORE RELYING ON IT
# 1. workflow_dispatch is only registered for workflow files that exist on the
#    DEFAULT branch. Until this file is merged to main, dispatching it 404s — so
#    it is unavailable on the very PR that introduces it. That is why PR #2
#    regenerated locally instead.
# 2. It inherits .env.visual automatically via `vite build --mode visual`, so it
#    builds the same bundle the `visual` job verifies.
#
# It deliberately does NOT commit or push. It uploads the regenerated snapshot
# folder as an artifact; a human downloads it, eyeballs the diff (this is a
# DESIGN gate, the whole point is that a person looks), and commits it. Auto-
# committing baselines would let an unintended visual change launder itself into
# the baseline and disappear.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are the baselines being regenerated? (goes in the artifact name)"
        required: true
        default: "environmental drift"

jobs:
  regenerate:
    name: Regenerate visual baselines
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser (chromium)
        run: cd packages/web && bunx playwright install --with-deps chromium
      - name: Regenerate snapshots
        # No env wiring needed here: playwright.visual.config.ts builds with
        # `vite build --mode visual`, which loads the committed, secret-free
        # .env.visual. So the bundle under test is byte-identical to the one the
        # `visual` job in ci.yml verifies — baselines can no longer be a function
        # of whichever VITE_* happened to be set on the machine that made them.
        run: cd packages/web && bun run test:visual:update
      - name: Report what moved
        # A regeneration that changes nothing means the diff was never
        # environmental, and someone should go and look at the actual PR instead.
        run: |
          cd packages/web
          if git diff --quiet -- e2e-visual/visual.spec.ts-snapshots/; then
            echo "::warning::No baseline changed. The CI diff was NOT environmental — investigate the change itself."
          else
            echo "Baselines changed:"
            git diff --stat -- e2e-visual/visual.spec.ts-snapshots/
          fi
      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ github.run_id }}
          path: packages/web/e2e-visual/visual.spec.ts-snapshots/
          retention-days: 14
